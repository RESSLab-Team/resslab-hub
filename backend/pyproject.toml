[project]
name = "resslab-hub"
version = "0.2.1"
description = ""
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "David Tang", email = "david.tang@epfl.ch" },
  { name = "Pierre Guilbert", email = "pierre.guilbert@epfl.ch" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2,<3",
  "dynaconf>=3.1.7,<4",
  "greenlet>=3,<4",
  "SQLAlchemy[asyncio]>=2.0.4,<3",
  "fastapi-pagination>=0.12.4,<0.13",
  "asyncpg>=0.28.0,<1",
  "alembic>=1.7.5,<2",
  "psycopg2-binary>=2.9.2,<3",
  "uvicorn>=0.30,<1",
  "chardet>=5.2.0,<6",
  "python-multipart>=0.0.30,<0.1",
  "requests>=2.32.3,<3",
  "google-auth>=2.35.0,<3",
  "slowapi>=0.1.10,<0.2",
  # runtime (not just tests): the startup cache warmer issues requests
  # against the app's own ASGI stack via httpx.ASGITransport
  "httpx>=0.27,<1",
  # GitHub App client for contribution PRs on the data repo
  "githubkit[auth-app]>=0.12,<0.13",
  # OAuth 2 / OIDC client for the sign-in flows (GitHub now, ORCID and the
  # academic IdPs later). Used as a plain AsyncOAuth2Client, not through the
  # Starlette integration, so no server-side session middleware is needed.
  "authlib>=1.3,<2",
  # Async SMTP for the login code mails.
  "aiosmtplib>=3,<4",
  # Backs pydantic's EmailStr, used on the sign-in form.
  "email-validator>=2,<3",
  # Academic email check behind the contributor grant (#248): the JetBrains
  # student-licence domain list, vendored in the wheel, so no network call.
  "pyswot>=0.5,<0.6",
]

[dependency-groups]
dev = [
  "pytest>=7.1.2,<8",
  "pytest-asyncio>=0.23,<0.24",
  "pytest-cov>=5,<6",
  "httpx>=0.27,<1",
  "pre-commit>=3.0.4,<4",
  "ruff>=0.9,<1",
  "sqlalchemy[mypy]>=2.0.4,<3",
  "watchfiles>=1.2.0",
]
sem = [
  "opencv-python-headless>=4.8,<5",
  "scikit-image>=0.22,<1",
  "Pillow>=12.3,<13",
  "exifread>=3.0,<4",
  "boto3>=1.34,<2",
]
figures = [
  "matplotlib>=3.8,<4",
  "numpy>=1.24,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resslab_hub"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (≈ flake8 defaults), I isort (≈ profile=black)
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["resslab_hub"]
branch = true
omit = [
  "resslab_hub/main.py",  # app wiring exercised only at startup
  "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[[tool.mypy.overrides]]
module = "dynaconf"
ignore_missing_imports = true
