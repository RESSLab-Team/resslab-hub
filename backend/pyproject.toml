[tool.poetry]
name = "resslab-hub"
version = "0.2.0"
description = ""
license = "GPL-3.0-or-later"
authors = ["David Tang <david.tang@epfl.ch>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.95.2"
dynaconf = "^3.1.7"
greenlet = "^1.1.2"
SQLAlchemy = {extras = ["asyncio"], version = "^2.0.4"}
fastapi-pagination = {extras = ["async-sqlalchemy"], version = "^0.12.4"}
asyncpg = "^0.27.0"
alembic = "^1.7.5"
psycopg2 = "^2.9.2"
uvicorn = "^0.22.0"
chardet = "^5.0.0"
google-analytics-data = "^0.16.1"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.2"
pre-commit = "^3.0.4"
flake8 = "^6.0.0"
black = "^23.1.0"
sqlalchemy = {extras = ["mypy"], version = "^2.0.4"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[[tool.mypy.overrides]]
module = "dynaconf"
ignore_missing_imports = true
