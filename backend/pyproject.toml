[project]
name = "resslab-hub"
version = "0.2.1"
description = ""
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "David Tang", email = "david.tang@epfl.ch" },
  { name = "Pierre Guilbert", email = "pierre.guilbert@epfl.ch" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2,<3",
  "dynaconf>=3.1.7,<4",
  "greenlet>=3,<4",
  "SQLAlchemy[asyncio]>=2.0.4,<3",
  "fastapi-pagination>=0.12.4,<0.13",
  "asyncpg>=0.28.0,<1",
  "alembic>=1.7.5,<2",
  "psycopg2-binary>=2.9.2,<3",
  "uvicorn>=0.30,<1",
  "chardet>=5.2.0,<6",
  "python-multipart>=0.0.6,<0.0.7",
  "requests>=2.32.3,<3",
  "google-auth>=2.35.0,<3",
  "slowapi>=0.1.10,<0.2",
  # runtime (not just tests): the startup cache warmer issues requests
  # against the app's own ASGI stack via httpx.ASGITransport
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
  "pytest>=7.1.2,<8",
  "pytest-asyncio>=0.23,<0.24",
  "pytest-cov>=5,<6",
  "httpx>=0.27,<1",
  "pre-commit>=3.0.4,<4",
  "ruff>=0.9,<1",
  "sqlalchemy[mypy]>=2.0.4,<3",
  "watchfiles>=1.2.0",
]
sem = [
  "opencv-python-headless>=4.8,<5",
  "scikit-image>=0.22,<1",
  "Pillow>=10.0,<12",
  "exifread>=3.0,<4",
  "boto3>=1.34,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resslab_hub"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (≈ flake8 defaults), I isort (≈ profile=black)
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["resslab_hub"]
branch = true
omit = [
  "resslab_hub/main.py",  # app wiring exercised only at startup
  "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[[tool.mypy.overrides]]
module = "dynaconf"
ignore_missing_imports = true
