[tool.poetry]
name = "resslab-tools"
version = "0.1.0"
description = ""
license = "GPL-3.0-or-later"
authors = ["David Tang <david.tang@epfl.ch>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.70.0"
dynaconf = "^3.1.7"
greenlet = "^1.1.2"
SQLAlchemy = {extras = ["asyncio"], version = "^1.4.29"}
fastapi-pagination = {extras = ["async_sqlalchemy"], version = "^0.9.1"}
asyncpg = "^0.24.0"
uvicorn = "^0.15.0"
alembic = "^1.7.5"
psycopg2 = "^2.9.2"

[tool.poetry.dev-dependencies]
pytest = "^5.2"
uvicorn = "^0.15.0"
python-dotenv = "^0.19.1"
pre-commit = "^2.16.0"
flake8 = "^4.0.1"
black = "^22.6.0"
SQLAlchemy = {extras = ["mypy"], version = "^1.4.29"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[[tool.mypy.overrides]]
module = "dynaconf"
ignore_missing_imports = true
