[default]
postgres_host = "localhost"
postgres_password = ""
# api_password is intentionally NOT defaulted here: it must be provided via the
# environment/secret (API_PASSWORD in secrets/.env for dev, the injected secret
# in prod). When it is unset, the write endpoints fail closed (503) instead of
# silently accepting a public placeholder — see routers/root.py.

[development]
# Vite dev server (:5173) calls the backend (:8000) cross-origin, so CORS must
# be on locally. Prod is same-origin behind Traefik and leaves this off.
cors_enabled = true
# No browser caching in dev: local data reloads must show up immediately.
cache_max_age = 0

[production]
postgres_host = "resslab-hub.epfl.ch"

[test]
postgres_host = "resslab-hub-test.epfl.ch"
