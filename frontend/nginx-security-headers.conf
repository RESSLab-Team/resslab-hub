# Security headers, included from nginx.conf (#264, M2).
#
# Included at server level AND in every location that has its own
# add_header: nginx drops the inherited add_header lines in such a location.
#
# The CSP is report-only for now: the browser only logs what it would block
# in the console. Make it enforcing (Content-Security-Policy) once dev and
# stage show a clean console for a while. What each source is for:
#   www.epfl.ch              EPFL cookie consent (css + js in index.html)
#   googletagmanager, google-analytics  vue-gtag (src/plugins/gtag.ts)
#   style 'unsafe-inline'    Vuetify, ECharts and MapLibre set style attributes
#   enacit4r-cdn.epfl.ch     SEM images and their JSON (src/utils/sem.ts)
#   tiles.openfreemap.org    map tiles and glyphs (src/utils/mapStyle.ts)
#   worker-src blob:         the MapLibre worker
#   people.epfl.ch           the photos on the About page
#   www.youtube.com          the video on the home page
#
# One report is expected and is fine: script-src "eval" from the echarts
# chunk. vue-echarts tries `new Function` once to define a custom element,
# in a try/catch, and uses a plain element when it is blocked. Don't add
# 'unsafe-eval' for it. (Checked on dev, 2026-11-24: home with the map, the
# braces, columns and tensile coupon dashboards, About: nothing else.)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.epfl.ch https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://www.epfl.ch; img-src 'self' data: blob: https://enacit4r-cdn.epfl.ch https://www.epfl.ch https://people.epfl.ch https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://enacit4r-cdn.epfl.ch https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; worker-src 'self' blob:; frame-src https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
