# nginx runs as a non-root user (#456): no `user` line, port 8080, and the pid
# and temp files in /tmp, the one folder any user can write to.
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;
events {
  worker_connections  1024;
}
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;
  server_tokens      off;

  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/javascript text/csv
                    application/javascript application/json application/wasm
                    image/svg+xml font/ttf font/otf;

  server {
    listen       8080;
    server_name  localhost;

    # Security headers (#264). Repeated in each location below that has its
    # own add_header, because nginx then drops the server level ones.
    include /etc/nginx/security-headers.conf;

    # Content-hashed build assets are immutable: cache them aggressively.
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico|csv|wasm)$ {
      root        /app;
      expires     1y;
      add_header  Cache-Control "public, immutable";
      include     /etc/nginx/security-headers.conf;
      try_files   $uri =404;
    }

    # The SPA entry point must always be revalidated so deploys aren't stale.
    location = /index.html {
      root        /app;
      add_header  Cache-Control "no-cache";
      include     /etc/nginx/security-headers.conf;
    }

    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
