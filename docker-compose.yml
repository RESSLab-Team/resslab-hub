services:
  reverse-proxy:
    image: traefik:v3.6
    depends_on:
      - backend
      - frontend
    command:
      - "--providers.docker"
      - "--providers.file.directory=/configuration/"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      # - "--api.dashboard=true"  # Enable Traefik Dashboard
      # - "--api.insecure=true"  # WARNING: Only for development
    labels:
      - "traefik.http.middlewares.secureHeaders.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secureHeaders.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.secureHeaders.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secureHeaders.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secureHeaders.headers.frameDeny=true"
      - "traefik.http.middlewares.secureHeaders.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.compress.compress=true"
      # - "traefik.enable=true"
      # - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      # - "traefik.http.routers.traefik.service=api@internal"
      # - "traefik.http.routers.traefik.entrypoints=websecure"
      # - "traefik.http.routers.traefik.tls=true"
    environment:
      - SSL_CERT_CRT=${SSL_CERT_CRT}
      - SSL_CERT_KEY=${SSL_CERT_KEY}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      # Read-only: Traefik only needs to watch the Docker API, never mutate it.
      # A writable socket makes any Traefik/container compromise root-equivalent
      # on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/configuration/traefik.yml
      - /etc/ssl:/etc/ssl

  frontend:
    build: ./frontend
    image: ghcr.io/resslab-team/resslab-hub/frontend:latest
    labels:
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.middlewares=secureHeaders@docker,compress@docker"
    restart: unless-stopped

  backend:
    build: ./backend
    image: ghcr.io/resslab-team/resslab-hub/backend:latest
    depends_on:
      - database
    env_file: secrets/.env
    environment:
      MODULE_NAME: resslab_hub.main
      FORWARDED_ALLOW_IPS: "*"
      CORS_ENABLED: "true"
      POSTGRES_HOST: database
      ROOT_PATH: /api
    labels:
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.middlewares=backend-stripprefix,secureHeaders@docker,compress@docker"
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"
    restart: unless-stopped

  database:
    image: postgres:14-alpine
    ports:
      # Bind to loopback only. Publishing on 0.0.0.0 inserts an iptables rule
      # that bypasses host firewalls, exposing the DB (superuser) to the network.
      # Local tooling reaches it on 127.0.0.1:5432; the backend uses the compose
      # network. For remote prod uploads, tunnel over SSH (see CLAUDE.md).
      - "127.0.0.1:5432:5432"
    env_file:
      - ./secrets/.env
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  database: {}
