# Lefthook orchestrates git hooks for the resslab-hub monorepo.
# Docs: https://lefthook.dev
#
# Hooks installed:
#   - commit-msg : enforce Conventional Commits (commitlint)
#   - pre-commit : ESLint + Prettier on staged frontend files,
#                  ruff on staged backend Python files,
#                  yaml and file-size checks on every staged file
#   - pre-push   : worktree push guard (own branch only, never dev/stage/main),
#                  full type-check (vue-tsc) and full backend lint
#
# Skip a single commit/push (escape hatch): LEFTHOOK=0 git commit ...

assert_lefthook_installed: true
min_version: 1.7.0

skip_output:
  - meta
  - skips

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: frontend-eslint
      glob: "frontend/**/*.{js,jsx,cjs,mjs,ts,tsx,cts,mts,vue}"
      root: "frontend/"
      # NB: --no-warn-ignored is ESLint v9+; the repo is on ESLint 8
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    - name: frontend-prettier
      glob: "frontend/**/*.{js,jsx,cjs,mjs,ts,tsx,cts,mts,vue,css,scss,html,json,md,yml,yaml}"
      root: "frontend/"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: backend-ruff
      glob: "backend/**/*.py"
      root: "backend/"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

    - name: check-yaml
      glob: "*.{yml,yaml}"
      run: bash scripts/check-yaml.sh {staged_files}

    - name: check-large-files
      run: bash scripts/check-large-files.sh {staged_files}

pre-push:
  parallel: true
  jobs:
    # Inside a git worktree, only the worktree's own branch may be pushed and
    # dev/stage/main never — Claude sessions live in worktrees. The main
    # checkout is exempt (scripts/wt-land.sh lands branches from there).
    - name: push-guard
      run: bash scripts/git-push-guard.sh
      use_stdin: true

    - name: frontend-type-check
      root: "frontend/"
      run: pnpm run type-check

    - name: backend-ruff-all
      root: "backend/"
      run: uv run ruff check . && uv run ruff format --check .
