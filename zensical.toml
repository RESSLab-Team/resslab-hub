# The docs site, built from docs/ by Zensical. Same setup as the ENAC-IT4R wiki.
# Build: `make docs` (strict, then the link and orphan checks). Preview: `make docs-serve`.
# Deployed to GitHub Pages from `main` by .github/workflows/deploy-pages.yml.
[project]
site_name = "RESSLab Hub docs"
site_url = "https://resslab-team.github.io/resslab-hub/"
site_description = "How the RESSLab Hub works: submit and review data, run the data pipeline, maintain the app"
repo_url = "https://github.com/RESSLab-Team/resslab-hub"
repo_name = "RESSLab-Team/resslab-hub"
edit_uri = "edit/dev/docs/"
docs_dir = "docs"

# Not built at all, so not in the search either. archive/ holds old plans and
# notes. The worktree guide is about the laptop setup of the team and its
# agents; it stays readable on GitHub.
exclude_docs = """
/archive/
/worktree-dev-environment.md
"""

# The sidebar, written by hand. A new page goes here, or is linked from a page
# that is here: scripts/docs_check_orphans.py fails otherwise.
nav = [
  { "Home" = "README.md" },
  { "Data pipeline" = [
    "data-pipeline/index.md",
    { "Submit data" = "data-pipeline/submit-data.md" },
    { "Review data" = "data-pipeline/review-data.md" },
    { "Run the pipeline" = "data-pipeline/run-the-pipeline.md" },
    { "Contribution internals" = "contributing-data.md" },
    { "Curation internals" = "curation.md" },
    { "Variable categories" = "variable-categories.md" },
  ] },
  { "For maintainers" = [
    { "What's new in 2.0" = "whats-new-in-2.0.md" },
    { "Releasing" = "releasing.md" },
    { "Sign-in and accounts" = "auth.md" },
    { "Dashboard architecture" = "dashboard-architecture.md" },
    { "Design system" = "design-system.md" },
    { "SEM images" = "sem-images.md" },
    { "Adding a new tab" = "adding-a-new-tab.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/RESSLab-Team/resslab-hub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
