# The site lives under /docs/, the path the ingress of each hub sends here
# with no rewrite. Locally: docker run -p 8080:8080, then /docs/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative: behind the ingress, nginx does not know the
    # public scheme, host and port.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /docs/;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /docs/404.html;
}
