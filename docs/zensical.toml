# The docs site, built by Zensical from the pages in src/. This folder is a
# small project of its own (pyproject.toml, Dockerfile, nginx.conf).
# Build: `make docs` from the repo root (strict, then the link and orphan
# checks). Preview: `make docs-serve`.
# Deployed as its own image (docs/Dockerfile), served under /docs/ of each hub.
[project]
site_name = "RESSLab Hub docs"
# Only the /docs/ path matters: the same image runs on dev, stage and prod.
site_url = "https://resslab-hub.epfl.ch/docs/"
site_description = "How the RESSLab Hub works: submit and review data, run the data pipeline, maintain the app"
repo_url = "https://github.com/RESSLab-Team/resslab-hub"
repo_name = "RESSLab-Team/resslab-hub"
edit_uri = "edit/dev/docs/src/"
docs_dir = "src"

# The sidebar, written by hand. A new page goes here, or is linked from a page
# that is here: scripts/docs_check_orphans.py fails otherwise.
nav = [
  { "Home" = "index.md" },
  # For researchers and curators.
  { "Contribute data" = [
    "contribute/index.md",
    { "Submit with the Hub" = "contribute/submit-with-the-hub.md" },
    # The root README of the data repo, copied by scripts/data-repo.py.
    { "Submit with a pull request" = "data/contributing.md" },
    { "Review and verify" = "contribute/review-and-verify.md" },
    { "Roles and permissions" = "contribute/roles-and-permissions.md" },
  ] },
  # src/data/ is generated from the data repo by scripts/data-repo.py
  # (make docs runs it). A new database folder there needs a line here.
  { "Databases" = [
    "data/index.md",
    { "Braces" = "data/braces/index.md" },
    { "Columns" = "data/columns/index.md" },
    { "Connections" = "data/connections/index.md" },
    { "HSS columns" = "data/hss_columns/index.md" },
    { "EBF links" = "data/eccentric_braced_frames/index.md" },
    { "Cyclic coupons" = "data/material/cyclic_coupons/index.md" },
    { "Tensile coupons" = "data/material/tensile_coupons/index.md" },
    { "Ductile fracture" = "data/material/ductile_fracture/index.md" },
    { "Residual stresses" = "data/residual_stresses/index.md" },
    { "Variable categories" = "variable-categories.md" },
  ] },
  # For the people who run a deployment or change the code.
  { "The Hub app" = [
    { "Operate" = [
      { "Run the data pipeline" = "run-the-pipeline.md" },
      { "Releasing" = "releasing.md" },
      { "Sign-in and accounts" = "auth.md" },
      { "SEM images" = "sem-images.md" },
    ] },
    { "Develop" = [
      { "What's new in 2.0" = "whats-new-in-2.0.md" },
      { "Dashboard architecture" = "dashboard-architecture.md" },
      { "Design system" = "design-system.md" },
      { "Adding a new tab" = "adding-a-new-tab.md" },
      { "Contribution internals" = "contributing-data.md" },
      { "Curation internals" = "curation.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
# System fonts: no call to Google Fonts from an epfl.ch page.
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/RESSLab-Team/resslab-hub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
