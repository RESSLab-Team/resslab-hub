# Builds the docs site (zensical.toml, docs/) and publishes it on GitHub Pages:
# https://resslab-team.github.io/resslab-hub/
# It deploys from main, the released version, so the site matches prod. The
# "Data reference" pages come from the main branch of the data repo, so a
# nightly run picks up its changes. A scheduled run starts from the default
# branch (dev), so the checkout below always takes main.
# Needs Settings > Pages > Source "GitHub Actions", and `main` and `dev`
# allowed in the deployment branch rules of the github-pages environment.
name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no major tag (v10)
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --only-group docs
        working-directory: backend
      # The data repo is public. Only its READMEs and dictionaries are needed.
      - uses: actions/checkout@v7
        with:
          repository: RESSLab-Team/resslab-hub-data
          ref: main
          path: data-repo
          lfs: false
          filter: blob:none
          sparse-checkout: |
            /README.md
            /**/README.md
            /**/*_data_dictionary.csv
          sparse-checkout-cone-mode: false
      - run: make docs RESSLAB_DATA_DIR=data-repo DATA_REF=HEAD
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
