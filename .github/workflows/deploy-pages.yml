# Builds the docs site (zensical.toml, docs/) and publishes it on GitHub Pages:
# https://resslab-team.github.io/resslab-hub/
# It deploys from main, the released version, so the site matches prod.
# Needs Settings > Pages > Source "GitHub Actions", and `main` allowed in the
# deployment branch rules of the github-pages environment.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no major tag (v10)
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --only-group docs
        working-directory: backend
      - run: make docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
