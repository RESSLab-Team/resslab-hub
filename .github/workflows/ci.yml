name: ci

on:
  push:
    branches:
      - dev
      - stage
      - main
  pull_request:
    branches:
      - dev
      - stage
      - main

# CI only reads the code. A job that needs more asks for it itself (#264 M4).
permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:unit run
      - run: pnpm run build
  check-api-client:
    # Guards against a stale generated client: regenerate frontend/src/backend
    # from the committed openapi.json and fail if it differs from what's checked in.
    # Java is needed only here (openapi-generator is a JVM tool), so the main
    # build-frontend job stays Node-only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Regenerate API client from committed openapi.json
        run: pnpm run api
      - name: Verify generated client is in sync with openapi.json
        run: |
          git add -N src/backend
          if ! git diff --exit-code -- src/backend; then
            echo "::error::frontend/src/backend is out of sync with openapi.json. Run 'make api' and commit the result."
            exit 1
          fi
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The pytest suite includes real-PostgreSQL integration tests (see
    # backend/tests/conftest.py): they need a live server on the backend's
    # default localhost:5432 and create/drop their own throwaway database.
    env:
      POSTGRES_PASSWORD: postgres
      API_PASSWORD: ci-test
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no major tag (v10)
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check --diff .
      - run: uv run pytest
  check-files:
    # Same yaml and file-size checks as the lefthook pre-commit hook,
    # on every tracked file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no major tag (v10)
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
        working-directory: backend
      - run: git ls-files -z '*.yml' '*.yaml' | xargs -0 bash scripts/check-yaml.sh
      - run: git ls-files -z | xargs -0 bash scripts/check-large-files.sh
  build-docs:
    # Builds the docs image, the one deploy.yml pushes. Its Dockerfile runs the
    # strict build (a warning fails it), then the link and orphan checks, and
    # it clones the data repo for the "Databases" pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull -t resslab-hub-docs docs
      - name: The image serves the site under /docs/
        run: |
          docker run -d --name docs -p 8080:8080 resslab-hub-docs
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/contribute/
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/data/braces/
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/docs)" = "301 http://127.0.0.1:8080/docs/"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs/nothing-here/)" = "404"
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir secrets
          touch secrets/.env
          mkdir backend/secrets
      # Build only, as a check that the Dockerfiles still work. The images the
      # cluster runs are built and pushed by deploy.yml under
      # ghcr.io/resslab-team/epfl-resslab/resslab-hub/, nothing reads the
      # compose ones, and the push to GHCR failed on flaky "unknown blob" errors.
      - run: docker compose build --parallel --pull
