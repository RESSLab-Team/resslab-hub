# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
name: deploy

on:
  push:
    branches: [dev, stage]
    tags: ['v*.*.*']
  # Manual fallback: a tag created by release-please with a token that cannot
  # trigger workflows deploys nothing. Then run this by hand on the tag:
  #   gh workflow run deploy.yml --ref v<version>
  workflow_dispatch:

# One deploy per branch or tag at a time. Two close pushes could finish in the
# wrong order and write the older image digest last, so a new run cancels the
# one still going.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.0.5
    secrets:
      token: ${{ secrets.CD_TOKEN }}
    with:
      org: epfl-resslab
      repo: resslab-hub
      build_context: '["./backend", "./frontend"]'
