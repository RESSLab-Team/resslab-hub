# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
name: deploy

on:
  push:
    branches: [dev, test, stage]
    tags: ['v*.*.*']

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.0.5
    secrets:
      token: ${{ secrets.CD_TOKEN }}
    with:
      org: epfl-resslab
      repo: resslab-hub
      build_context: '["./backend", "./frontend"]'
